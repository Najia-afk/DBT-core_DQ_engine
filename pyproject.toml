[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-engine"
version = "0.1.0"
description = "Moteur MDM pilote par configuration (ETL, ELT, graphe), mode delta"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "duckdb==2.0.0",
    "pyarrow==26.0.1",
    "numpy==2.5.4",
    "rapidfuzz==3.14.6",
    "psutil==7.2.2",
    "psycopg-pool==3.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.2",
]
elt = [
    "dbt-core==1.12.7",
    "dbt-duckdb==1.11.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine", "engine.*"]
namespaces = false

[tool.setuptools.package-data]
"engine.runtime" = ["schema.sql"]
"engine.lanes.elt" = ["dbt_project/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
